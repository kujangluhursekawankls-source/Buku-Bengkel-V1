    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function() {
        var origErr = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg && (typeof arg === 'string' || arg.message) && (String(arg).includes('WebSocket') || (arg.message && arg.message.includes('WebSocket')))) {
              return;
            }
          }
          return origErr.apply(console, arguments);
        };
        window.addEventListener('error', function (event) {
          if (event && event.message && event.message.includes('WebSocket')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          if (event && event.reason && (event.reason.message || String(event.reason)).includes('WebSocket')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-teal-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
